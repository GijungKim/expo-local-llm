plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.android'
}

group = 'expo.modules.localllm'
// Single source of truth: the npm package version.
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace "expo.modules.localllm"
  compileSdk 35

  defaultConfig {
    minSdk 26
    versionCode 1
    versionName project.version
    consumerProguardFiles 'proguard-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // beta4 provides multipart Content, which is required for multiple images. Its
  // metadata requires Kotlin 2.2.21 or newer in the consuming application.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
  // beta4 calls the Job.cancel(message, cause) compatibility bridge that is
  // only present in recent coroutines releases. Pin Android explicitly so an
  // application's older transitive version cannot cause a runtime ABI error.
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
