plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.android'
}

group = 'expo.modules.localllm'
// Single source of truth: the npm package version.
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace "expo.modules.localllm"
  compileSdk 35

  defaultConfig {
    minSdk 26
    versionCode 1
    versionName project.version
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // beta3+ uses Kotlin 2.3 metadata and stdlib, which Expo 57's Kotlin 2.1
  // compiler cannot consume. beta2 is the newest release with supported 2.2
  // metadata and its declared Kotlin 1.8 runtime dependency remains intact.
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta2'

  testImplementation 'junit:junit:4.13.2'
}
