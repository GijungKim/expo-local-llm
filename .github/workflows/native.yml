name: Native compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24

jobs:
  android:
    name: Android example
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 25 (current LTS). JDK 24+ restricts native access, so the
          # Android check opts in — see tools/native-check/android.sh.
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to the obsolete SDK "tools" package.
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build package and generate Android project
        run: tools/native-check/prepare-example.sh android

      - name: Compile Android development app
        run: tools/native-check/android.sh

  ios:
    name: iOS example
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Build package and generate iOS project
        run: tools/native-check/prepare-example.sh ios

      - name: Compile iOS development app
        run: tools/native-check/ios.sh
