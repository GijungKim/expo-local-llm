name: Native compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24

jobs:
  # Docs-only pull requests cannot change what compiles, so the native jobs skip
  # them. A skipped job reports success, and pushes to main always run.
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            native:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  android:
    name: Android example
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 25 (current LTS). JDK 24+ restricts native access, so the
          # Android check opts in — see tools/native-check/android.sh.
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to the obsolete SDK "tools" package.
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build package and generate Android project
        run: tools/native-check/prepare-example.sh android

      - name: Compile Android development app
        run: tools/native-check/android.sh

  ios:
    name: iOS example
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('example/bun.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Build package and generate iOS project
        run: tools/native-check/prepare-example.sh ios

      - name: Compile iOS development app
        run: tools/native-check/ios.sh
